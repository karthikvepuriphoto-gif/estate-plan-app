", "holographic_will_valid": "yes", "age_of_majority": 18, "property_system": "common law", "elective_share": "unverified", "state_estate_or_inheritance_tax": "none", "statutory_poa_form": "yes (Uniform Power of Attorney Act)", "advance_directive_form": "unverified", "tod_deed_allowed": "yes", "small_estate_limit": "unverified", "notes": "", "sources": ["https://law.justia.com/codes/virginia/", "https://taxfoundation.org/data/all/state/estate-inheritance-taxes/", "https://www.uniformlaws.org/committees/community-home?CommunityKey=b1975254-8370-4a7c-947f-e5af0d6cb07c"]}, "WA": {"code": "WA", "name": "Washington", "will_witnesses": "2", "self_proving_affidavit": "yes", "holographic_will_valid": "no", "age_of_majority": 18, "property_system": "community property", "elective_share": "Community property: surviving spouse already owns half of community assets; no elective share", "state_estate_or_inheritance_tax": "Estate tax; exemption $3,076,000 (to 6/30/2026), $3,000,000 from 7/1/2026", "statutory_poa_form": "yes (Uniform Power of Attorney Act)", "advance_directive_form": "unverified", "tod_deed_allowed": "yes", "small_estate_limit": "unverified", "notes": "", "sources": ["https://law.justia.com/codes/washington/", "https://taxfoundation.org/data/all/state/estate-inheritance-taxes/", "https://www.uniformlaws.org/committees/community-home?CommunityKey=b1975254-8370-4a7c-947f-e5af0d6cb07c"]}, "WV": {"code": "WV", "name": "West Virginia", "will_witnesses": "2", "self_proving_affidavit": "yes", "holographic_will_valid": "yes", "age_of_majority": 18, "property_system": "common law", "elective_share": "unverified", "state_estate_or_inheritance_tax": "none", "statutory_poa_form": "yes (Uniform Power of Attorney Act)", "advance_directive_form": "unverified", "tod_deed_allowed": "yes", "small_estate_limit": "unverified", "notes": "", "sources": ["https://law.justia.com/codes/west-virginia/", "https://taxfoundation.org/data/all/state/estate-inheritance-taxes/", "https://www.uniformlaws.org/committees/community-home?CommunityKey=b1975254-8370-4a7c-947f-e5af0d6cb07c"]}, "WI": {"code": "WI", "name": "Wisconsin", "will_witnesses": "2", "self_proving_affidavit": "unverified", "holographic_will_valid": "no", "age_of_majority": 18, "property_system": "community property (marital property act)", "elective_share": "Community property: surviving spouse already owns half of community assets; no elective share", "state_estate_or_inheritance_tax": "none", "statutory_poa_form": "yes (Uniform Power of Attorney Act)", "advance_directive_form": "unverified", "tod_deed_allowed": "yes", "small_estate_limit": "unverified", "notes": "", "sources": ["https://law.justia.com/codes/wisconsin/", "https://taxfoundation.org/data/all/state/estate-inheritance-taxes/", "https://www.uniformlaws.org/committees/community-home?CommunityKey=b1975254-8370-4a7c-947f-e5af0d6cb07c"]}, "WY": {"code": "WY", "name": "Wyoming", "will_witnesses": "2", "self_proving_affidavit": "yes", "holographic_will_valid": "yes", "age_of_majority": 18, "property_system": "common law", "elective_share": "unverified", "state_estate_or_inheritance_tax": "none", "statutory_poa_form": "yes (Uniform Power of Attorney Act)", "advance_directive_form": "unverified", "tod_deed_allowed": "yes", "small_estate_limit": "unverified", "notes": "", "sources": ["https://law.justia.com/codes/wyoming/", "https://taxfoundation.org/data/all/state/estate-inheritance-taxes/", "https://www.uniformlaws.org/committees/community-home?CommunityKey=b1975254-8370-4a7c-947f-e5af0d6cb07c"]}}}, "citizenship": {"_meta": {"as_of": "2026-10-29", "federal": {"basic_exclusion_2026": 15000000, "annual_gift_exclusion_2026": 19000, "gift_to_noncitizen_spouse_2026": 194000, "nra_estate_exemption": 60000, "source": ["https://www.irs.gov/pub/irs-drop/rp-25-32.pdf", "https://www.irs.gov/businesses/small-businesses-self-employed/whats-new-estate-and-gift-tax"]}}, "cases": [{"id": "us_citizen", "title": "U.S. citizen", "plain": "You get the full federal exemption ($15,000,000 in 2026, indexed after) on worldwide assets. Anything left to a U.S.-citizen spouse passes tax-free under the unlimited marital deduction.", "sources": ["https://www.irs.gov/pub/irs-drop/rp-25-32.pdf"]}, {"id": "domiciliary", "title": "Green card holder or visa holder who is U.S. domiciled", "plain": "Estate tax follows domicile (where you live and intend to stay), not your visa. A U.S. domiciliary gets the same $15,000,000 exemption as a citizen, but on WORLDWIDE assets, including property in India. Green card holders are almost always treated as domiciled; H-1B/L-1 holders often are too, depending on facts.", "sources": ["https://www.irs.gov/individuals/international-taxpayers/some-nonresidents-with-us-assets-must-file-estate-tax-returns"]}, {"id": "nonresident_alien", "title": "Non-citizen NOT domiciled in the U.S.", "plain": "Only U.S.-situs assets (U.S. real estate, U.S. company stock, tangible property here) are taxed, but the exemption is only $60,000 (a $13,000 credit) unless a treaty helps. Bank deposits and most life insurance proceeds are generally not U.S.-situs for estate tax.", "sources": ["https://www.irs.gov/individuals/international-taxpayers/some-nonresidents-with-us-assets-must-file-estate-tax-returns", "https://www.law.cornell.edu/uscode/text/26/2102"]}, {"id": "noncitizen_spouse", "title": "Surviving spouse is not a U.S. citizen", "plain": "The unlimited marital deduction does NOT apply when the surviving spouse is not a U.S. citizen, even with a green card. Assets above the deceased spouse's exemption can be taxed at the first death unless they go into a Qualified Domestic Trust (QDOT), which needs at least one U.S.-citizen or U.S.-corporate trustee; distributions of principal are taxed later. The surviving spouse can also become a citizen before the estate tax return is due. Lifetime gifts to a non-citizen spouse are tax-free only up to $194,000 in 2026.", "sources": ["https://www.law.cornell.edu/uscode/text/26/2056A", "https://www.law.cornell.edu/uscode/text/26/2056", "https://www.irs.gov/pub/irs-drop/rp-25-32.pdf"]}, {"id": "both_noncitizens", "title": "Both spouses non-citizens", "plain": "Both of you need to know your domicile status. If domiciled, each has the $15,000,000 exemption, so most families won't owe federal estate tax at all; QDOT matters mainly for estates above that. Portability (DSUE) is available to a non-citizen surviving spouse only if they are a U.S. domiciliary, and a QDOT complicates it. Your state's own estate tax may apply at much lower amounts.", "sources": ["https://www.law.cornell.edu/cfr/text/26/20.2010-2"]}, {"id": "mixed", "title": "One citizen, one non-citizen", "plain": "If the citizen spouse dies first, the marital deduction is unavailable for the non-citizen survivor (QDOT planning). If the non-citizen dies first, the citizen survivor gets the unlimited marital deduction normally. Wills are usually not mirror-image for tax purposes.", "sources": ["https://www.law.cornell.edu/uscode/text/26/2056"]}, {"id": "india", "title": "Assets in India", "plain": "There is NO U.S.-India estate tax treaty (the U.S.-India treaty covers income tax only), so no treaty exemption or credit-sharing rule applies. India currently has no estate or inheritance tax (abolished in 1985), so double estate tax is usually not the issue; the issue is getting Indian property transferred. A separate Indian will for Indian assets, signed under the Indian Succession Act, avoids having a U.S. will probated or resealed in India. Probate is mandatory for wills covering property in Mumbai, Chennai, and Kolkata jurisdictions. NRIs may inherit Indian property under FEMA; repatriation limits apply (about USD 1 million per financial year).", "sources": ["https://www.irs.gov/businesses/international-businesses/united-states-income-tax-treaties-a-to-z", "https://www.indiacode.nic.in/handle/123456789/2385", "https://www.rbi.org.in/"]}, {"id": "foreign_wills_situs", "title": "Foreign wills and situs", "plain": "Use one will per country, each limited to that country's assets, and make sure the later one does not revoke the earlier one by accident. Situs decides which country taxes an asset: real estate is taxed where it sits.", "sources": ["https://www.uniformlaws.org/committees/community-home?CommunityKey=b6b6d9b2-28b5-4bbd-9d76-cd1db4fe0b68"]}, {"id": "guardian_abroad", "title": "Guardian who lives abroad", "plain": "U.S. courts can appoint a guardian who lives in India, but they look at the child's best interests and may want a U.S. backup. Moving the child abroad may need court permission and immigration steps. Name a U.S.-based alternate and a U.S. trustee for the money.", "sources": ["https://www.nolo.com/legal-encyclopedia/choosing-guardian-your-children.html"]}, {"id": "fbar", "title": "FBAR and foreign accounts", "plain": "U.S. persons (citizens, green card holders, and resident aliens for tax) must file FinCEN Form 114 (FBAR) if foreign accounts total over $10,000 at any time in the year, and possibly Form 8938 (FATCA). Your executor needs a list of these accounts. Inheriting from a foreign person over $100,000 requires Form 3520 (reporting only).", "sources": ["https://www.irs.gov/businesses/small-businesses-self-employed/report-of-foreign-bank-and-financial-accounts-fbar", "https://www.irs.gov/businesses/comparison-of-form-8938-and-fbar-requirements", "https://www.irs.gov/forms-pubs/about-form-3520"]}]}};const _f=window.fetch;window.fetch=u=>{const k=(String(u).match(/(\w+)\.json$/)||[])[1];return k&&window.__DATA[k]?Promise.resolve({json:()=>window.__DATA[k]}):_f(u)};</script>
